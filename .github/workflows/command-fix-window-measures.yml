name: Command fix window measures

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix-window-measures:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 3 &&
      github.event.comment.body == '/fix-window-measures' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Head repository no autorizado');
            }
            if (pr.head.ref !== 'work/ns-lineage-window-fix') {
              core.setFailed(`Rama no autorizada: ${pr.head.ref}`);
            }
            core.setOutput('head_ref', pr.head.ref);

      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic repair
        run: python tools/fix_window_text_measures.py

      - name: Validate repaired TMDL
        run: python tools/fix_window_text_measures.py --check

      - name: Commit repaired model
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NS.SemanticModel/definition/tables/Medidas.tmdl Docs/AUDITORIA_LIVE/latest/window_measure_validation.json
          git commit -m "fix(model): corregir medidas de texto de ventana temporal [skip ci]"
          git push origin HEAD:${{ steps.pr.outputs.head_ref }}
