name: Command fix window measures

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix-window-measures:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 3 &&
      github.event.comment.body == '/fix-window-measures-v3' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mark workflow start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'AUTOMATION_START_V3 · diagnóstico y reparación iniciados'
            });

      - name: Read pull request
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Head repository no autorizado');
            }
            if (pr.head.ref !== 'work/ns-lineage-window-fix') {
              core.setFailed(`Rama no autorizada: ${pr.head.ref}`);
            }
            core.setOutput('head_ref', pr.head.ref);

      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate deterministic repair
        id: repair
        shell: bash
        run: |
          set +e
          {
            echo '=== APPLY ==='
            python tools/fix_window_text_measures.py
            APPLY_CODE=$?
            echo "APPLY_CODE=$APPLY_CODE"
            if [ "$APPLY_CODE" -eq 0 ]; then
              echo '=== CHECK ==='
              python tools/fix_window_text_measures.py --check
              CHECK_CODE=$?
            else
              CHECK_CODE=99
            fi
            echo "CHECK_CODE=$CHECK_CODE"
          } > /tmp/window_repair.log 2>&1
          cat /tmp/window_repair.log
          if [ "$APPLY_CODE" -ne 0 ] || [ "$CHECK_CODE" -ne 0 ]; then
            exit 1
          fi

      - name: Comment diagnostic on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/window_repair.log')
              ? fs.readFileSync('/tmp/window_repair.log', 'utf8')
              : 'No se generó window_repair.log; el fallo ocurrió antes del script.';
            const clipped = raw.slice(0, 5000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `AUTOMATION_DIAGNOSTIC · ROJO\n\n\`\`\`text\n${clipped}\n\`\`\``
            });

      - name: Commit repaired model
        id: commit
        if: success()
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NS.SemanticModel/definition/tables/Medidas.tmdl Docs/AUDITORIA_LIVE/latest/window_measure_validation.json
          git commit -m "fix(model): corregir medidas de texto de ventana temporal [skip ci]"
          git push origin HEAD:${{ steps.pr.outputs.head_ref }}
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark successful result
        if: success()
        uses: actions/github-script@v7
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `AUTOMATION_END · VERDE · changed=${process.env.CHANGED || 'false'} · sha=${process.env.SHA || 'sin_nuevo_commit'}`
            });
