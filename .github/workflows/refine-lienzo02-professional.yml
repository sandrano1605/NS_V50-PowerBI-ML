name: Refine lienzo 02 professional

on:
  push:
    branches:
      - work/ns-lienzo-02-ingreso-pedidos
    paths:
      - 'Docs/AUDITORIA_LIVE/REFINE_LIENZO02_RUN.md'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/ns-lienzo-02-ingreso-pedidos
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and apply refinement
        run: |
          python -m py_compile tools/refine_lienzo_02_professional.py
          python tools/refine_lienzo_02_professional.py
          python tools/refine_lienzo_02_professional.py

      - name: Validate JSON and scope
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          page = Path('NS.Report/definition/pages/df1cb253a6314642a469')
          for p in page.glob('visuals/*/visual.json'):
              json.loads(p.read_text(encoding='utf-8-sig'))
          result = json.loads(Path('Docs/AUDITORIA_LIVE/latest/lienzo_02_professional_validation.json').read_text(encoding='utf-8-sig'))
          assert result['status'] == 'VERDE', result
          assert result['measure'] is True
          assert all(v == 'cardVisual' for v in result['cards'].values())
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
          git diff --check

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            NS.SemanticModel/definition/tables/Medidas.tmdl \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/table_9601cabf413a41/visual.json \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/table_62c6c02944b14e/visual.json \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/table_bad13c26c1d64f/visual.json \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/in_nota_cierre/visual.json \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/chart_924aca87b5094c/visual.json \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/in_chart_pedidos_dia_mes/visual.json \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/in_chart_lineas_dia_mes/visual.json \
            NS.Report/definition/pages/df1cb253a6314642a469/visuals/in_chart_unidades_dia_mes/visual.json \
            Docs/AUDITORIA_LIVE/latest/lienzo_02_professional_validation.json
          git commit -m "feat(lienzo-02): agregar valores y lectura ejecutiva profesional [skip ci]"
          git push origin HEAD:work/ns-lienzo-02-ingreso-pedidos
