name: Fix VBAK missing SQL columns

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/fix-vbak-missing-columns-v2' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/ns-vbak-master-append
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate
        id: run
        shell: bash
        run: |
          set +e
          {
            echo '=== PY COMPILE ==='
            python -m py_compile tools/fix_vbak_missing_sql_columns.py
            COMPILE=$?
            echo "COMPILE=$COMPILE"
            echo '=== APPLY ==='
            if [ "$COMPILE" -eq 0 ]; then
              python tools/fix_vbak_missing_sql_columns.py
              APPLY=$?
            else
              APPLY=99
            fi
            echo "APPLY=$APPLY"
            echo '=== FORBIDDEN ==='
            grep -R -n -E 'V\.VSBED|V\.CMGST|K\.ORT01' \
              NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl \
              PowerQuery/VBAK_APPEND/00_VBAK_SCHEMA_PREFLIGHT.pq \
              PowerQuery/VBAK_APPEND/02_VBAK_ATRIBUTOS_MAYORISTA.pq \
              PowerQuery/VBAK_APPEND/06_MASTER_APPEND_INLINE_ACTIVE.pq
            GREP=$?
            echo "GREP=$GREP (1 esperado)"
            echo '=== DIFF CHECK ==='
            git diff --check
            DIFF=$?
            echo "DIFF=$DIFF"
            echo '=== CHANGED ==='
            git diff --name-only
          } > /tmp/vbak_sql_fix.log 2>&1
          cat /tmp/vbak_sql_fix.log
          if [ "$COMPILE" -ne 0 ] || [ "$APPLY" -ne 0 ] || [ "$GREP" -ne 1 ] || [ "$DIFF" -ne 0 ]; then
            exit 1
          fi

      - name: Comment diagnostic on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/vbak_sql_fix.log') ? fs.readFileSync('/tmp/vbak_sql_fix.log','utf8') : 'Sin log';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `VBAK_SQL_COLUMNS_FIX · ROJO\n\n\`\`\`text\n${raw.slice(0,7000)}\n\`\`\``
            });

      - name: Commit and push
        if: success()
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl \
            PowerQuery/VBAK_APPEND/00_VBAK_SCHEMA_PREFLIGHT.pq \
            PowerQuery/VBAK_APPEND/02_VBAK_ATRIBUTOS_MAYORISTA.pq \
            PowerQuery/VBAK_APPEND/06_MASTER_APPEND_INLINE_ACTIVE.pq \
            Docs/AUDITORIA_LIVE/latest/vbak_sql_columns_fix.json
          git commit -m "fix(vbak): adaptar cruce al esquema SQL real [skip ci]"
          git push origin HEAD:work/ns-vbak-master-append
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `VBAK_SQL_COLUMNS_FIX · VERDE · ${process.env.SHA}`
            });
