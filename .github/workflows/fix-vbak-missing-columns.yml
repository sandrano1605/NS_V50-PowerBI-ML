name: Fix VBAK missing SQL columns

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  fix:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/fix-vbak-missing-columns' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/ns-vbak-master-append
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic fix
        run: python tools/fix_vbak_missing_sql_columns.py

      - name: Validate no invalid references remain
        shell: bash
        run: |
          ! grep -R -n -E 'V\.VSBED|V\.CMGST|K\.ORT01' \
            NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl \
            PowerQuery/VBAK_APPEND/00_VBAK_SCHEMA_PREFLIGHT.pq \
            PowerQuery/VBAK_APPEND/02_VBAK_ATRIBUTOS_MAYORISTA.pq \
            PowerQuery/VBAK_APPEND/06_MASTER_APPEND_INLINE_ACTIVE.pq
          git diff --check

      - name: Commit and push
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl \
            PowerQuery/VBAK_APPEND/00_VBAK_SCHEMA_PREFLIGHT.pq \
            PowerQuery/VBAK_APPEND/02_VBAK_ATRIBUTOS_MAYORISTA.pq \
            PowerQuery/VBAK_APPEND/06_MASTER_APPEND_INLINE_ACTIVE.pq \
            Docs/AUDITORIA_LIVE/latest/vbak_sql_columns_fix.json
          git commit -m "fix(vbak): adaptar cruce al esquema SQL real [skip ci]"
          git push origin HEAD:work/ns-vbak-master-append
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `VBAK_SQL_COLUMNS_FIX · VERDE · ${process.env.SHA}`
                : 'VBAK_SQL_COLUMNS_FIX · ROJO · revisar workflow'
            });
