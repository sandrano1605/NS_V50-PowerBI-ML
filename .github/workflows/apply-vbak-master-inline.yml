name: Apply VBAK master inline

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/apply-vbak-master-inline' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/ns-vbak-master-append
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic patch
        run: python tools/apply_vbak_master_inline.py

      - name: Validate scope
        shell: bash
        run: |
          python tools/validate_vbak_append_kit.py
          git diff --check
          test "$(git diff --name-only | grep -E '^NS\.Report/' | wc -l)" -eq 0
          test "$(git diff --name-only | grep -E '^NS\.SemanticModel/' | grep -v '^NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl$' | wc -l)" -eq 0

      - name: Commit and push
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl Docs/AUDITORIA_LIVE/latest/vbak_master_inline_validation.json Docs/AUDITORIA_LIVE/latest/vbak_append_kit_validation.json
          git commit -m "feat(vbak): cruzar pedidos normales faltantes en master [skip ci]"
          git push origin HEAD:work/ns-vbak-master-append
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `VBAK_MASTER_INLINE · VERDE · ${process.env.SHA}`
                : 'VBAK_MASTER_INLINE · ROJO · revisar workflow'
            });
