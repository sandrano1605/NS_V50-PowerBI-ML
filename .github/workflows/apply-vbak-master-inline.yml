name: Apply VBAK master inline

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/apply-vbak-master-inline-v3' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/ns-vbak-master-append
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply and validate
        id: run
        shell: bash
        run: |
          set +e
          {
            echo '=== APPLY ==='
            python tools/apply_vbak_master_inline.py
            APPLY=$?
            echo "APPLY=$APPLY"
            if [ "$APPLY" -eq 0 ]; then
              echo '=== KIT ==='
              python tools/validate_vbak_append_kit.py
              KIT=$?
            else
              KIT=99
            fi
            echo "KIT=$KIT"
            echo '=== DIFF CHECK ==='
            git diff --check
            DIFF=$?
            echo "DIFF=$DIFF"
            echo '=== CHANGED ==='
            git diff --name-only
          } > /tmp/vbak_inline.log 2>&1
          cat /tmp/vbak_inline.log
          if [ "$APPLY" -ne 0 ] || [ "$KIT" -ne 0 ] || [ "$DIFF" -ne 0 ]; then
            exit 1
          fi
          OTHER=$(git diff --name-only | grep -E '^NS\.SemanticModel/' | grep -v '^NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl$' | wc -l)
          REPORT=$(git diff --name-only | grep -E '^NS\.Report/' | wc -l)
          if [ "$OTHER" -ne 0 ] || [ "$REPORT" -ne 0 ]; then
            echo "Alcance inválido: OTHER=$OTHER REPORT=$REPORT" >> /tmp/vbak_inline.log
            exit 1
          fi

      - name: Comment diagnostic on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/vbak_inline.log') ? fs.readFileSync('/tmp/vbak_inline.log','utf8') : 'Sin log';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `VBAK_MASTER_INLINE · ROJO\n\n\`\`\`text\n${raw.slice(0,7000)}\n\`\`\``
            });

      - name: Commit and push
        if: success()
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NS.SemanticModel/definition/tables/Fact_Pedidos_Auditoria.tmdl Docs/AUDITORIA_LIVE/latest/vbak_master_inline_validation.json Docs/AUDITORIA_LIVE/latest/vbak_append_kit_validation.json
          git commit -m "feat(vbak): cruzar pedidos normales faltantes en master [skip ci]"
          git push origin HEAD:work/ns-vbak-master-append
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `VBAK_MASTER_INLINE · VERDE · ${process.env.SHA}`
            });
