name: Inventory lienzo 02

on:
  push:
    branches:
      - work/ns-lienzo-02-ingreso-pedidos
    paths:
      - 'Docs/AUDITORIA_LIVE/INVENTORY_LIENZO_02_RUN.md'

permissions:
  contents: write

jobs:
  inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/ns-lienzo-02-ingreso-pedidos
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build inventory
        run: python tools/inventory_report_pages.py

      - name: Validate JSON outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
              Path('Docs/AUDITORIA_LIVE/latest/report_pages_inventory.json'),
              Path('Docs/AUDITORIA_LIVE/latest/page_00_02_inventory.json'),
              Path('Docs/AUDITORIA_LIVE/latest/report_visual_templates.json'),
              Path('Docs/AUDITORIA_LIVE/latest/page00_slicer_templates/manifest.json'),
          ]
          for path in files:
              json.loads(path.read_text(encoding='utf-8-sig'))
              print('OK', path)
          PY
          git diff --check

      - name: Commit inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Docs/AUDITORIA_LIVE/latest
          git commit -m "audit(lienzo-02): inventariar visuales y filtros existentes [skip ci]"
          git push origin HEAD:work/ns-lienzo-02-ingreso-pedidos
