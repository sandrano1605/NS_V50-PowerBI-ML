name: Fix FA multiselect helpers

on:
  push:
    branches:
      - work/ns-lienzo-02-ingreso-pedidos
    paths:
      - Docs/AUDITORIA_LIVE/RUN_FIX_FA_MULTISELECT_20260811.md

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama objetivo
        uses: actions/checkout@v4
        with:
          ref: work/ns-lienzo-02-ingreso-pedidos
          fetch-depth: 0

      - name: Corregir filtros multiselect FA
        shell: python
        run: |
          from pathlib import Path
          import csv
          import io
          import re

          medidas_path = Path("NS.SemanticModel/definition/tables/Medidas.tmdl")
          audit_dir = Path("Docs/AUDITORIA_LIVE/runs/20260810_232706_auditoria_integral_modelo_lienzos")
          audit_out = audit_dir / "10_multiselect_lienzo01_fa_fix.csv"
          audit_09 = audit_dir / "09_visuales_lienzo00.csv"
          incoherencias = audit_dir / "15_incoherencias.csv"

          text = medidas_path.read_text(encoding="utf-8")
          original = text

          flow_pat = re.compile(
              r'''\(\s*ISBLANK\(FlujoSel\)\s*\|\|\s*\(CONTAINSSTRING\(FlujoSel,\s*"Flujo Normal"\)\s*&&\s*Fact_Tracking\[CLASIFICACION\]\s*=\s*"NORMAL"\)\s*\|\|\s*\(CONTAINSSTRING\(FlujoSel,\s*"FES"\)\s*&&\s*Fact_Tracking\[CLASIFICACION\]\s*IN\s*\{\s*"FES"\s*,\s*"FES \+ SALDO"\s*\}\)\s*\|\|\s*\(CONTAINSSTRING\(FlujoSel,\s*"Saldos"\)\s*&&\s*Fact_Tracking\[CLASIFICACION\]\s*=\s*"SALDO"\)\s*\)''',
              re.MULTILINE,
          )
          zone_pat = re.compile(
              r'''\(\s*ISBLANK\(ZonaSel\)\s*\|\|\s*Fact_Tracking\[ZONA\]\s*=\s*ZonaSel\s*\)''',
              re.MULTILINE,
          )
          var_flujo_pat = re.compile(
              r'''\bVAR\s+FlujoSel\s*=\s*SELECTEDVALUE\(Dim_Vista_Ejecutiva\[Flujo\]\)\s*'''
          )
          var_zona_pat = re.compile(
              r'''\bVAR\s+ZonaSel\s*=\s*SELECTEDVALUE\(Dim_Rango_Entrega\[Zona\]\)\s*'''
          )

          # Cada bloque comienza en una medida y termina justo antes de la siguiente.
          block_pat = re.compile(
              r'''(?ms)^\tmeasure\s+'(?P<name>FA [^']+)'\s*=.*?(?=^\tmeasure\s+'|\Z)'''
          )

          changed = []
          rows = []

          def transform(match):
              block = match.group(0)
              name = match.group("name")
              before = block

              n_flow = len(flow_pat.findall(block))
              n_zone = len(zone_pat.findall(block))

              if n_flow:
                  block = flow_pat.sub("[RE Filtro Flujo]", block)
              if n_zone:
                  block = zone_pat.sub("[RE Filtro Zona]", block)

              if n_flow or n_zone:
                  block = var_flujo_pat.sub("", block)
                  block = var_zona_pat.sub("", block)

                  # No debe quedar ninguna referencia huérfana en las medidas modificadas.
                  if "FlujoSel" in block or "ZonaSel" in block:
                      raise RuntimeError(f"Referencia antigua residual en {name}")

                  changed.append(name)
                  rows.append((name, n_flow, n_zone, "CORREGIDO_ESTRUCTURAL"))

              return block

          text = block_pat.sub(transform, text)

          if len(changed) < 9:
              raise RuntimeError(f"Se esperaban al menos 9 medidas FA afectadas; encontradas {len(changed)}: {changed}")
          if text == original:
              raise RuntimeError("No se generaron cambios en Medidas.tmdl")

          # Validación estructural: ninguna medida FA puede conservar el patrón antiguo de filtro.
          fa_blocks_after = [m.group(0) for m in block_pat.finditer(text)]
          fa_text_after = "\n".join(fa_blocks_after)
          if flow_pat.search(fa_text_after) or zone_pat.search(fa_text_after):
              raise RuntimeError("Quedó al menos un patrón antiguo FlujoSel/ZonaSel en una medida FA")

          medidas_path.write_text(text, encoding="utf-8")

          audit_dir.mkdir(parents=True, exist_ok=True)
          with audit_out.open("w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f)
              w.writerow(["MEDIDA", "PATRONES_FLUJO_REEMPLAZADOS", "PATRONES_ZONA_REEMPLAZADOS", "ESTADO"])
              w.writerows(rows)
              w.writerow([])
              w.writerow(["TOTAL_MEDIDAS_CORREGIDAS", len(changed), "", "PENDIENTE_VALIDACION_VIVA_POWER_BI"])
              w.writerow(["PATRON_NUEVO", "[RE Filtro Flujo]", "[RE Filtro Zona]", "HELPERS_COMUNES"])

          if audit_09.exists():
              s = audit_09.read_text(encoding="utf-8-sig")
              s = re.sub(
                  r"Medidas_FA_con_SELECTEDVALUE,9 \(pendiente lienzo 01\)",
                  f"Medidas_FA_multiselect_status,CORREGIDO_ESTRUCTURAL ({len(changed)} medidas; pendiente validacion viva Power BI)",
                  s,
                  count=1,
              )
              audit_09.write_text(s, encoding="utf-8-sig")

          if incoherencias.exists():
              s = incoherencias.read_text(encoding="utf-8-sig")
              s = s.replace(
                  "INC-009,Medidas FA lienzo 01: 9 medidas con SELECTEDVALUE (multiselect incompleto),AMARIL - lienzos 01/02,Medidas,PENDIENTE",
                  f"INC-009,Medidas FA: filtros Flujo/Zona multiselect con patron SELECTEDVALUE,AMARILLO - lienzos 01/02,Medidas,CORREGIDO_ESTRUCTURAL ({len(changed)} medidas; pendiente validacion viva Power BI)",
                  1,
              )
              incoherencias.write_text(s, encoding="utf-8-sig")

          print("CORREGIDO_ESTRUCTURAL")
          print(f"TOTAL={len(changed)}")
          for name in changed:
              print(f" - {name}")

      - name: Validaciones de texto
        shell: bash
        run: |
          set -euo pipefail
          test -s Docs/AUDITORIA_LIVE/runs/20260810_232706_auditoria_integral_modelo_lienzos/10_multiselect_lienzo01_fa_fix.csv
          grep -q "RE Filtro Flujo" NS.SemanticModel/definition/tables/Medidas.tmdl
          grep -q "RE Filtro Zona" NS.SemanticModel/definition/tables/Medidas.tmdl
          git diff --check
          git diff --stat

      - name: Commit y push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            NS.SemanticModel/definition/tables/Medidas.tmdl \
            Docs/AUDITORIA_LIVE/runs/20260810_232706_auditoria_integral_modelo_lienzos/09_visuales_lienzo00.csv \
            Docs/AUDITORIA_LIVE/runs/20260810_232706_auditoria_integral_modelo_lienzos/10_multiselect_lienzo01_fa_fix.csv \
            Docs/AUDITORIA_LIVE/runs/20260810_232706_auditoria_integral_modelo_lienzos/15_incoherencias.csv
          git commit -m "fix(lienzo-01): corregir multiselect FA con helpers Flujo/Zona"
          git push origin HEAD:work/ns-lienzo-02-ingreso-pedidos
