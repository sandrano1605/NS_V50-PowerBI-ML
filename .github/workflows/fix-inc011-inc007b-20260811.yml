name: fix-inc011-inc007b-20260811

on:
  push:
    branches:
      - work/ns-lienzo-02-ingreso-pedidos
    paths:
      - .github/workflows/fix-inc011-inc007b-20260811.yml

permissions:
  contents: write

jobs:
  patch-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ns-lienzo-02-ingreso-pedidos
          fetch-depth: 0

      - name: Patch Fact_Tracking INC-011 and INC-007B
        shell: python
        run: |
          from pathlib import Path

          path = Path("NS.SemanticModel/definition/tables/Fact_Tracking.tmdl")
          text = path.read_text(encoding="utf-8-sig")

          old_desp = '''\t\t\t\t    Desp = Table.AddColumn(FacturaCierre, "FECHA_DESPACHO", each\n\t\t\t\t        let\n\t\t\t\t            Real = if [TRP_U_FECHA_HORA]<>null then [TRP_U_FECHA_HORA] else [TRP_P_FECHA_HORA],\n\t\t\t\t            Factura = [FACTURA_CIERRE_BASE],\n'''
          new_desp = '''\t\t\t\t    Desp = Table.AddColumn(FacturaCierre, "FECHA_DESPACHO", each\n\t\t\t\t        let\n\t\t\t\t            RealRaw = if [TRP_U_FECHA_HORA]<>null then [TRP_U_FECHA_HORA] else [TRP_P_FECHA_HORA],\n\t\t\t\t            // Un despacho no puede ser anterior a la creación del pedido.\n\t\t\t\t            // Fechas imposibles/sentinela se tratan como ausencia de despacho real.\n\t\t\t\t            Real = if RealRaw<>null and [PED_FECHA_HORA]<>null and RealRaw < [PED_FECHA_HORA] then null else RealRaw,\n\t\t\t\t            Factura = [FACTURA_CIERRE_BASE],\n'''

          old_man = '''\t\t\t\t    // Manifiesto FES: prioridad al último manifiesto obtenido por VBFA/VTTP.\n\t\t\t\t    // Cuando el enlace VBFA/VTTP no devuelve fecha pero el tracking sí contiene TRP,\n\t\t\t\t    // se usa TRP_U/TRP_P como respaldo operacional del manifiesto.\n\t\t\t\t    Man = Table.AddColumn(Desp, "FECHA_MANIFIESTO", each\n\t\t\t\t        if [ES_FES]<>true then null\n\t\t\t\t        else if [ULTIMA_FECHA_MANIFIESTO]<>null then DateTime.From([ULTIMA_FECHA_MANIFIESTO])\n\t\t\t\t        else if [PRIMERA_FECHA_MANIFIESTO]<>null then DateTime.From([PRIMERA_FECHA_MANIFIESTO])\n\t\t\t\t        else if [TRP_U_FECHA_HORA]<>null then [TRP_U_FECHA_HORA]\n\t\t\t\t        else [TRP_P_FECHA_HORA],\n\t\t\t\t        type nullable datetime),\n'''
          new_man = '''\t\t\t\t    // Manifiesto FES oficial: exclusivamente VBFA/VTTP.\n\t\t\t\t    // TRP representa salida física y no reemplaza el manifiesto documental de cierre FES.\n\t\t\t\t    Man = Table.AddColumn(Desp, "FECHA_MANIFIESTO", each\n\t\t\t\t        if [ES_FES]<>true then null\n\t\t\t\t        else if [ULTIMA_FECHA_MANIFIESTO]<>null then DateTime.From([ULTIMA_FECHA_MANIFIESTO])\n\t\t\t\t        else if [PRIMERA_FECHA_MANIFIESTO]<>null then DateTime.From([PRIMERA_FECHA_MANIFIESTO])\n\t\t\t\t        else null,\n\t\t\t\t        type nullable datetime),\n'''

          if text.count(old_desp) != 1:
              raise SystemExit(f"Bloque Desp esperado encontrado {text.count(old_desp)} veces; se esperaba 1")
          if text.count(old_man) != 1:
              raise SystemExit(f"Bloque Man esperado encontrado {text.count(old_man)} veces; se esperaba 1")

          text = text.replace(old_desp, new_desp, 1)
          text = text.replace(old_man, new_man, 1)
          path.write_text(text, encoding="utf-8")

          assert "RealRaw" in text
          assert "RealRaw < [PED_FECHA_HORA]" in text
          man_start = text.index('Man = Table.AddColumn(Desp, "FECHA_MANIFIESTO"')
          man_end = text.index('// Cierre oficial', man_start)
          man_block = text[man_start:man_end]
          assert "TRP_U_FECHA_HORA" not in man_block
          assert "TRP_P_FECHA_HORA" not in man_block

      - name: Validate diff
        run: |
          git diff --check
          git diff -- NS.SemanticModel/definition/tables/Fact_Tracking.tmdl

      - name: Commit functional fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NS.SemanticModel/definition/tables/Fact_Tracking.tmdl
          git commit -m "fix(tracking): validar despacho y cierre FES oficial"
          git push origin HEAD:work/ns-lienzo-02-ingreso-pedidos
