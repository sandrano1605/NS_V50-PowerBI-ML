name: Repair and validate PBIP native visuals

on:
  push:
    branches:
      - work/ns-native-repair

permissions:
  contents: write

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/ns-native-repair
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic JSON repair dependency
        run: python -m pip install --disable-pip-version-check json-repair==0.47.1

      - name: Repair malformed JSON and validate report structure
        run: python tools/repair_validate_pbip.py --repair

      - name: Validate a second time without repair
        run: python tools/repair_validate_pbip.py

      - name: Commit repaired JSON and validation evidence
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NS.Report Docs/AUDITORIA_LIVE/latest/structural_validation.json
          git commit -m "fix(report): reparar JSON y validar visuales nativos [skip ci]"
          git push origin HEAD:work/ns-native-repair
